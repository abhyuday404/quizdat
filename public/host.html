<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>QuizDat · Host</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <!-- Quiz editor -->
  <section id="editor" class="wrap hidden">
    <div class="editor-head">
      <div class="title-field">
        <input id="quizTitle" maxlength="120" placeholder="Quiz title" aria-label="Quiz title" title="Click to edit the quiz title">
      </div>
      <button id="loadSample" class="ghost">Sample</button>
      <button id="importBtn" class="ghost">Import</button>
      <button id="exportBtn" class="ghost">Export</button>
      <input id="importFile" type="file" accept="application/json,.json" class="hidden">
    </div>
    <div id="questions"></div>
    <button id="addQuestion" class="ghost add-question">+ Add question</button>
    <div class="toolbar">
      <div class="error" id="editorError"></div>
      <span class="spacer"></span>
      <button id="startSession" class="primary big">Start session</button>
    </div>
  </section>

  <!-- Live session -->
  <section id="stage" class="stage hidden">
    <div class="stage-top">
      <span class="muted" id="quizTitlePill"></span>
      <span class="spacer"></span>
      <div class="pill code-pill" id="codePill"></div>
      <div class="pill" id="countPill">👥 0</div>
      <button class="ghost icon" id="fullscreenBtn" title="Full screen (F)" aria-label="Full screen">⤢</button>
    </div>
    <div class="stage-main" id="stageMain"></div>
    <div class="stage-bottom">
      <span class="spacer"></span>
      <button class="danger" id="endBtn">End quiz</button>
      <button class="ghost" id="secondaryBtn"></button>
      <button class="primary big" id="primaryBtn"></button>
    </div>
    <div class="mini-qr hidden" id="miniQr"></div>
  </section>

  <div class="toast hidden" id="toast"></div>
  <script src="/net.js"></script>
  <script src="/common.js"></script>
  <script src="/host.js"></script>
</body>
</html>
