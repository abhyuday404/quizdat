<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0f1020">
  <title>QR Quiz · Join</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <div class="phone">
    <div class="phone-top">
      <span class="spacer"></span>
      <span class="pill hidden" id="whoPill"></span>
    </div>
    <main class="phone-main" id="main">
      <form id="joinForm" class="card hidden" autocomplete="off">
        <h1>Join</h1>
        <input id="code" maxlength="8" autocapitalize="characters" inputmode="text" placeholder="Room code" aria-label="Room code">
        <div style="height:10px"></div>
        <div class="name-row">
          <input id="name" maxlength="24" placeholder="Your name" aria-label="Your name" autocomplete="off">
          <button type="button" class="ghost icon" id="shuffleName" title="Another name" aria-label="Another name">↻</button>
        </div>
        <div class="error" id="joinError" style="margin-top:10px"></div>
        <button class="primary big" style="width:100%" id="joinBtn">Join</button>
      </form>
      <div id="view"></div>
    </main>
  </div>
  <div class="toast hidden" id="toast"></div>
  <script src="/net.js"></script>
  <script src="/common.js"></script>
  <script src="/play.js"></script>
</body>
</html>
