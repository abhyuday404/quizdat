<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0f1020">
  <title>QR Quiz · Join</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <div class="phone">
    <div class="phone-top">
      <a href="/" class="brand">QR Quiz</a>
      <span class="spacer"></span>
      <span class="pill hidden" id="whoPill"></span>
    </div>
    <main class="phone-main" id="main">
      <form id="joinForm" class="card hidden" autocomplete="off">
        <h1>Join the quiz</h1>
        <label class="small" for="code">Room code</label>
        <input id="code" maxlength="8" autocapitalize="characters" inputmode="text" placeholder="ABCDE">
        <div style="height:14px"></div>
        <label class="small" for="name">Your name</label>
        <input id="name" maxlength="24" placeholder="e.g. Sam" autocomplete="nickname">
        <div class="error" id="joinError" style="margin-top:10px"></div>
        <button class="primary big" style="width:100%" id="joinBtn">Join</button>
      </form>
      <div id="view"></div>
    </main>
  </div>
  <div class="toast hidden" id="toast"></div>
  <script src="/net.js"></script>
  <script src="/common.js"></script>
  <script src="/play.js"></script>
</body>
</html>
