<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>QR Quiz</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <main class="hero">
    <div>
      <h1 class="brand">QR <span>Quiz</span></h1>
      <p class="muted">Run a live quiz on the big screen. Everyone joins by scanning a QR code.</p>
      <div class="choices">
        <a class="card choice btn" href="/host" style="display:block">
          <h2>🎤 Host a quiz</h2>
          <div class="muted">Write questions, show the QR code, see answers come in.</div>
        </a>
        <a class="card choice btn" href="/play" style="display:block">
          <h2>📱 Join a quiz</h2>
          <div class="muted">Enter the room code shown on the presenter screen.</div>
        </a>
      </div>
    </div>
  </main>
</body>
</html>
