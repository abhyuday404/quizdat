<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Run a live quiz on the big screen. Everyone joins by scanning a QR code, and after each question you see how the room answered.">
  <title>QR Quiz</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <main class="hero">
    <div>
      <h1>A quiz the whole room can play.</h1>
      <div class="choices">
        <a class="choice" href="/host">
          <h2>Host a quiz</h2>
          <span class="arrow">→</span>
        </a>
        <a class="choice" href="/play">
          <h2>Join a quiz</h2>
          <span class="arrow">→</span>
        </a>
      </div>
    </div>
  </main>
</body>
</html>
